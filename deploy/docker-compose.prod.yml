version: "3.8"

# Copy to /srv/apps/bookings/prod/docker-compose.yml on the VPS.

services:
  bookings-prod:
    build:
      context: ./repo
      dockerfile: Dockerfile
    container_name: bookings-prod
    restart: unless-stopped
    env_file: /srv/apps/bookings/prod/.env
    volumes:
      - /srv/data/bookings/prod/storage:/var/www/html/storage/app/public
    networks:
      - app-prod
      - db-prod
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  app-prod:
    external: true
  db-prod:
    external: true
