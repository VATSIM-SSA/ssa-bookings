version: "3.8"

# Copy to /srv/apps/bookings/staging/docker-compose.yml on the VPS.
# Build context is the repo checked out at /srv/apps/bookings/staging/repo.

services:
  bookings-staging:
    build:
      context: ./repo
      dockerfile: Dockerfile
    container_name: bookings-staging
    restart: unless-stopped
    env_file: /srv/apps/bookings/staging/.env
    volumes:
      - /srv/data/bookings/staging/storage:/var/www/html/storage/app/public
    networks:
      - app-staging
      - db-staging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  app-staging:
    external: true
  db-staging:
    external: true
